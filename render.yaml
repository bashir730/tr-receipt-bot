# Render blueprint for tr-receipt-bot (WhatsApp receipt dedup bot).
# Secrets (PAIRING_SECRET) are set in the Render dashboard / API, not here.
services:
  - type: web
    name: tr-receipt-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OCR_LANG
        value: tur+eng
      - key: LOG_LEVEL
        value: info
